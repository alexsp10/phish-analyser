name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Samples are up to date
        if: matrix.python-version == '3.13'  # header folding can differ slightly between Python versions
        run: |
          python scripts/generate_samples.py
          git diff --exit-code samples/
      - name: Tests
        run: pytest -v

  demo-report:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Analyse the sample emails
        run: phishcheck samples --brands samples/demo-brands.json --html report.html
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: report.html
