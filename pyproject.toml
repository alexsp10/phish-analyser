[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishcheck"
version = "0.1.0"
description = "Offline phishing email analyser for .eml files and Gmail Takeout .mbox archives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
phishcheck = "phishcheck.cli:main"
phishcheck-gui = "phishcheck.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishcheck = ["brands.json", "ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
